name: wishpool-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: wishpool-postgres
    environment:
      POSTGRES_DB: wishpool
      POSTGRES_USER: wishpool
      POSTGRES_PASSWORD: wishpool
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishpool -d wishpool"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wishpool-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: wishpool-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wishpool
      MINIO_ROOT_PASSWORD: wishpool-local
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: wishpool-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 wishpool wishpool-local &&
      mc mb --ignore-existing local/wishpool-media &&
      mc anonymous set none local/wishpool-media
      "

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.26}
    container_name: wishpool-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: wishpool
      POSTGRES_PWD: wishpool
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal-dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.38.0}
    container_name: wishpool-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"

  core-api:
    image: eclipse-temurin:21-jdk
    container_name: wishpool-core-api
    working_dir: /workspace
    command: ./services/core-api/gradlew -p services/core-api bootRun
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      WISHPOOL_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wishpool
      WISHPOOL_DATASOURCE_USERNAME: wishpool
      WISHPOOL_DATASOURCE_PASSWORD: wishpool
      WISHPOOL_FLYWAY_LOCATIONS: filesystem:/workspace/db/migrations
      WISHPOOL_TOKEN_SECRET: ${WISHPOOL_TOKEN_SECRET:-wishpool-local-development-token-secret-change-me}
      WISHPOOL_LOCAL_DEBUG_PHONE_CODE: ${WISHPOOL_LOCAL_DEBUG_PHONE_CODE:-true}
      WISHPOOL_S3_ENDPOINT: http://minio:9000
      WISHPOOL_S3_BUCKET: wishpool-media
      WISHPOOL_S3_ACCESS_KEY: wishpool
      WISHPOOL_S3_SECRET_KEY: wishpool-local
      WISHPOOL_S3_REGION: local
      WISHPOOL_AI_WORKER_BASE_URL: http://ai-worker:8100
      WISHPOOL_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    volumes:
      - ../../:/workspace

  realtime-gateway:
    image: eclipse-temurin:21-jdk
    container_name: wishpool-realtime-gateway
    working_dir: /workspace
    command: ./services/realtime-gateway/gradlew -p services/realtime-gateway run
    depends_on:
      - core-api
      - redis
    environment:
      PORT: 8081
      WISHPOOL_CORE_API_BASE_URL: http://core-api:8080
      WISHPOOL_REDIS_URI: redis://redis:6379
    ports:
      - "${REALTIME_GATEWAY_PORT:-8081}:8081"
    volumes:
      - ../../:/workspace

  workflow-worker:
    image: eclipse-temurin:21-jdk
    container_name: wishpool-workflow-worker
    working_dir: /workspace
    command: ./services/workflow-worker/gradlew -p services/workflow-worker run
    depends_on:
      - core-api
      - temporal
    environment:
      WISHPOOL_CORE_API_BASE_URL: http://core-api:8080
      WISHPOOL_TEMPORAL_TARGET: temporal:7233
      WISHPOOL_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
    volumes:
      - ../../:/workspace

  ai-worker:
    image: python:3.12-slim
    container_name: wishpool-ai-worker
    working_dir: /workspace
    command: python -m ai_worker
    environment:
      PYTHONPATH: /workspace/services/ai-worker
      WISHPOOL_AI_HOST: 0.0.0.0
      WISHPOOL_AI_PORT: 8100
      WISHPOOL_AI_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
    ports:
      - "${AI_WORKER_PORT:-8100}:8100"
    volumes:
      - ../../:/workspace

  media-worker:
    image: python:3.12-slim
    container_name: wishpool-media-worker
    working_dir: /workspace
    command: >
      /bin/sh -c "python -m pip install --no-cache-dir -r services/media-worker/requirements.txt &&
      python -m media_worker"
    depends_on:
      - core-api
      - minio
    environment:
      PYTHONPATH: /workspace/services/media-worker
      WISHPOOL_CORE_API_BASE_URL: http://core-api:8080
      WISHPOOL_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
      WISHPOOL_S3_ENDPOINT: http://minio:9000
      WISHPOOL_S3_ACCESS_KEY: wishpool
      WISHPOOL_S3_SECRET_KEY: wishpool-local
      WISHPOOL_S3_BUCKET: wishpool-media
    volumes:
      - ../../:/workspace

  notification-service:
    image: eclipse-temurin:21-jdk
    container_name: wishpool-notification-service
    working_dir: /workspace
    command: ./services/notification-service/gradlew -p services/notification-service run
    depends_on:
      - core-api
    environment:
      PORT: 8084
      WISHPOOL_CORE_API_BASE_URL: http://core-api:8080
      WISHPOOL_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
      WISHPOOL_NOTIFICATION_DISPATCH_ENABLED: "false"
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    volumes:
      - ../../:/workspace

  admin-api:
    image: eclipse-temurin:21-jdk
    container_name: wishpool-admin-api
    working_dir: /workspace
    command: ./services/admin-api/gradlew -p services/admin-api run
    depends_on:
      - core-api
    environment:
      PORT: 8083
      WISHPOOL_CORE_API_BASE_URL: http://core-api:8080
      WISHPOOL_INTERNAL_TOKEN: ${WISHPOOL_INTERNAL_TOKEN:-wishpool-local-internal-token}
      WISHPOOL_ADMIN_TOKEN: ${WISHPOOL_ADMIN_TOKEN:-wishpool-local-admin-token}
    ports:
      - "${ADMIN_API_PORT:-8083}:8083"
    volumes:
      - ../../:/workspace

  parent-web:
    image: node:22-alpine
    container_name: wishpool-parent-web
    working_dir: /workspace
    command: npm run dev --workspace @wishpool/parent-web -- --hostname 0.0.0.0
    depends_on:
      - core-api
      - realtime-gateway
    environment:
      NEXT_PUBLIC_WISHPOOL_CORE_API_URL: http://core-api:8080
      NEXT_PUBLIC_WISHPOOL_REALTIME_URL: http://realtime-gateway:8081
    ports:
      - "${PARENT_WEB_PORT:-3000}:3000"
    volumes:
      - ../../:/workspace

  admin-web:
    image: node:22-alpine
    container_name: wishpool-admin-web
    working_dir: /workspace
    command: npm run dev --workspace @wishpool/admin-web -- --hostname 0.0.0.0
    depends_on:
      - admin-api
      - core-api
    environment:
      NEXT_PUBLIC_WISHPOOL_ADMIN_API_URL: http://admin-api:8083
      NEXT_PUBLIC_WISHPOOL_CORE_API_URL: http://core-api:8080
      NEXT_PUBLIC_WISHPOOL_TEMPORAL_UI_URL: http://temporal-ui:8080
      NEXT_PUBLIC_WISHPOOL_MINIO_CONSOLE_URL: http://minio:9001
      WISHPOOL_ADMIN_TOKEN: ${WISHPOOL_ADMIN_TOKEN:-wishpool-local-admin-token}
    ports:
      - "${ADMIN_WEB_PORT:-3001}:3001"
    volumes:
      - ../../:/workspace

volumes:
  postgres_data:
  minio_data:
