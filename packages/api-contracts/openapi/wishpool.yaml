openapi: 3.1.0
info:
  title: WishPool API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    WishPool core API contract for mobile apps, parent web, admin web, and backend services.
    All write endpoints are command-oriented and should be called with an Idempotency-Key header.
servers:
  - url: http://localhost:8080
    description: Local core-api
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Parent login, session refresh, and authenticated user context.
  - name: Families
    description: Family spaces, members, and parent invitations.
  - name: Children
    description: Child profiles and child-specific contexts.
  - name: Pairing
    description: Child device pairing sessions and consumption.
  - name: Task Templates
    description: Reusable task templates managed by parents.
  - name: Plans
    description: Weekly planning rules and materialized schedules.
  - name: Tasks
    description: Daily task instances and child task actions.
  - name: Media
    description: Media upload sessions, metadata, and download references.
  - name: Submissions
    description: Child task submissions and submission detail views.
  - name: Reviews
    description: Parent review queue, decisions, and feedback.
  - name: Wishes
    description: Wish cards, wish fragments, and redemption records.
  - name: Memories
    description: Weekly memories and export jobs.
  - name: Room
    description: Child room state and arrangement.
  - name: Sync
    description: Family event pull synchronization.
  - name: Notifications
    description: Inbox notifications, push tokens, and notification preferences.
  - name: Privacy
    description: Privacy export and deletion requests.
  - name: Admin
    description: Local administration metadata, audit, and governed media access.
  - name: Internal
    description: Internal worker APIs protected by X-Internal-Token.

paths:
  /auth/phone-codes:
    post:
      tags: [Auth]
      security: []
      operationId: requestPhoneCode
      summary: Request a phone verification code for parent login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
      responses:
        '200':
          description: Phone verification code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneCodeCreated'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Log in a parent user with phone or provider token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        default:
          $ref: '#/components/responses/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshSession
      summary: Refresh an access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        default:
          $ref: '#/components/responses/Error'

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the current authenticated user context.
      responses:
        '200':
          description: Current user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        default:
          $ref: '#/components/responses/Error'

  /families:
    post:
      tags: [Families]
      operationId: createFamily
      summary: Create a family.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyRequest'
      responses:
        '201':
          description: Family created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        default:
          $ref: '#/components/responses/Error'

  /families/{familyId}:
    get:
      tags: [Families]
      operationId: getFamily
      summary: Get family details.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        default:
          $ref: '#/components/responses/Error'

  /families/{familyId}/members:
    get:
      tags: [Families]
      operationId: listFamilyMembers
      summary: List family members.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Family members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMember'
        default:
          $ref: '#/components/responses/Error'

  /families/{familyId}/invites:
    post:
      tags: [Families]
      operationId: inviteParent
      summary: Invite a parent to a family.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteParentRequest'
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyInvite'
        default:
          $ref: '#/components/responses/Error'

  /families/{familyId}/children:
    get:
      tags: [Children]
      operationId: listChildren
      summary: List children in a family.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Children.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Children]
      operationId: createChild
      summary: Create a child profile.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        default:
          $ref: '#/components/responses/Error'

  /children/{childId}:
    patch:
      tags: [Children]
      operationId: updateChild
      summary: Update child profile.
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildRequest'
      responses:
        '200':
          description: Child profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        default:
          $ref: '#/components/responses/Error'

  /families/{familyId}/pairing-sessions:
    post:
      tags: [Pairing]
      operationId: createPairingSession
      summary: Create a child device pairing session.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePairingSessionRequest'
      responses:
        '201':
          description: Pairing session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingSessionCreated'
        default:
          $ref: '#/components/responses/Error'

  /pairing/consume:
    post:
      tags: [Pairing]
      security: []
      operationId: consumePairingCode
      summary: Pair a child device with a family.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumePairingCodeRequest'
      responses:
        '200':
          description: Device paired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        default:
          $ref: '#/components/responses/Error'

  /task-templates:
    get:
      tags: [Task Templates]
      operationId: listTaskTemplates
      summary: List task templates for the current family.
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskTemplate'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Task Templates]
      operationId: createTaskTemplate
      summary: Create a task template.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskTemplateRequest'
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTemplate'
        default:
          $ref: '#/components/responses/Error'

  /plans:
    post:
      tags: [Plans]
      operationId: saveWeeklyPlan
      summary: Create or update a weekly plan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWeeklyPlanRequest'
      responses:
        '200':
          description: Weekly plan saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlan'
        default:
          $ref: '#/components/responses/Error'

  /plans/{planId}:
    get:
      tags: [Plans]
      operationId: getWeeklyPlan
      summary: Get a weekly plan.
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Weekly plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyPlan'
        default:
          $ref: '#/components/responses/Error'

  /children/{childId}/today:
    get:
      tags: [Tasks]
      operationId: getToday
      summary: Get child today dashboard data.
      parameters:
        - $ref: '#/components/parameters/ChildId'
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Today snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySnapshot'
        default:
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/skip:
    post:
      tags: [Tasks]
      operationId: skipTask
      summary: Mark a task as skipped.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipTaskRequest'
      responses:
        '200':
          description: Task skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
        default:
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/postpone:
    post:
      tags: [Tasks]
      operationId: postponeTask
      summary: Postpone a task to another date.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostponeTaskRequest'
      responses:
        '200':
          description: Task postponed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
        default:
          $ref: '#/components/responses/Error'

  /media/upload-sessions:
    post:
      tags: [Media]
      operationId: createUploadSession
      summary: Create a signed upload session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        default:
          $ref: '#/components/responses/Error'

  /media/{mediaId}/finalize:
    post:
      tags: [Media]
      operationId: finalizeMedia
      summary: Finalize a media upload.
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeMediaRequest'
      responses:
        '200':
          description: Media finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        default:
          $ref: '#/components/responses/Error'

  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Create a child submission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '201':
          description: Submission created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          $ref: '#/components/responses/Error'

  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get submission details.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        default:
          $ref: '#/components/responses/Error'

  /reviews/pending:
    get:
      tags: [Reviews]
      operationId: listPendingReviews
      summary: List pending reviews.
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending review cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingReviewCard'
        default:
          $ref: '#/components/responses/Error'

  /reviews:
    post:
      tags: [Reviews]
      operationId: reviewSubmission
      summary: Approve or reject a submission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
      responses:
        '201':
          description: Review created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        default:
          $ref: '#/components/responses/Error'

  /reviews/{submissionId}/detail:
    get:
      tags: [Reviews]
      operationId: getReviewDetail
      summary: Get a review detail view for a submission.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        default:
          $ref: '#/components/responses/Error'

  /reviews/{reviewId}/revoke:
    post:
      tags: [Reviews]
      operationId: revokeReview
      summary: Revoke a review and create adjustment records when needed.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeReviewRequest'
      responses:
        '200':
          description: Review revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        default:
          $ref: '#/components/responses/Error'

  /wishes:
    post:
      tags: [Wishes]
      operationId: createWish
      summary: Create a wish.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishRequest'
      responses:
        '201':
          description: Wish created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        default:
          $ref: '#/components/responses/Error'

  /wishes/{wishId}/activate:
    post:
      tags: [Wishes]
      operationId: activateWish
      summary: Activate a wish.
      parameters:
        - $ref: '#/components/parameters/WishId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Wish activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        default:
          $ref: '#/components/responses/Error'

  /wishes/{wishId}:
    get:
      tags: [Wishes]
      operationId: getWish
      summary: Get a wish.
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '200':
          description: Wish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        default:
          $ref: '#/components/responses/Error'

  /wishes/{wishId}/redeem:
    post:
      tags: [Wishes]
      operationId: redeemWish
      summary: Redeem an unlocked wish.
      parameters:
        - $ref: '#/components/parameters/WishId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemWishRequest'
      responses:
        '200':
          description: Wish redeemed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishRedemption'
        default:
          $ref: '#/components/responses/Error'

  /children/{childId}/wishes/current:
    get:
      tags: [Wishes]
      operationId: getCurrentWish
      summary: Get the current wish for a child.
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Current wish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        default:
          $ref: '#/components/responses/Error'

  /children/{childId}/wishes:
    get:
      tags: [Wishes]
      operationId: listChildWishes
      summary: List wishes for a child.
      parameters:
        - $ref: '#/components/parameters/ChildId'
        - name: weekId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Child wishes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wish'
        default:
          $ref: '#/components/responses/Error'

  /memories:
    get:
      tags: [Memories]
      operationId: listMemories
      summary: List memories for a child.
      parameters:
        - name: childId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Memory timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryTimeline'
        default:
          $ref: '#/components/responses/Error'

  /memories/{memoryId}:
    get:
      tags: [Memories]
      operationId: getMemory
      summary: Get a memory detail.
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Weekly memory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMemory'
        default:
          $ref: '#/components/responses/Error'

  /memories/{memoryId}/export:
    post:
      tags: [Memories]
      operationId: exportMemory
      summary: Request memory export.
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMemoryRequest'
      responses:
        '202':
          description: Export requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryExport'
        default:
          $ref: '#/components/responses/Error'

  /room/state:
    get:
      tags: [Room]
      operationId: getRoomState
      summary: Get room state for a child.
      parameters:
        - name: childId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Room state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomState'
        default:
          $ref: '#/components/responses/Error'

  /room/items/{itemId}/arrange:
    post:
      tags: [Room]
      operationId: arrangeRoomItem
      summary: Arrange a room item.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrangeRoomItemRequest'
      responses:
        '200':
          description: Room item arranged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomItem'
        default:
          $ref: '#/components/responses/Error'

  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullSyncEvents
      summary: Pull family events after a sequence number.
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSeq
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Family events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's inbox notifications.
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, sent, failed, read]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Inbox notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        default:
          $ref: '#/components/responses/Error'

  /notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      summary: Mark inbox notifications as read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationReadRequest'
      responses:
        '200':
          description: Updated notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        default:
          $ref: '#/components/responses/Error'

  /notification-preferences:
    get:
      tags: [Notifications]
      operationId: listNotificationPreferences
