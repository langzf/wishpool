components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WishId:
      name: wishId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string

    LoginRequest:
      type: object
      required: [provider, credential]
      properties:
        provider:
          type: string
          enum: [phone, wechat]
        credential:
          type: string
          description: For phone login, use `verificationToken:code` returned by `/auth/phone-codes`; for WeChat, use the provider token.
        device:
          $ref: '#/components/schemas/DeviceRegistration'

    PhoneCodeRequest:
      type: object
      required: [phoneNumber, purpose]
      properties:
        phoneNumber:
          type: string
          minLength: 5
          maxLength: 32
        purpose:
          type: string
          enum: [login]

    PhoneCodeCreated:
      type: object
      required: [verificationToken, expiresAt]
      properties:
        verificationToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        debugCode:
          anyOf:
            - type: string
            - type: 'null'
          description: Present only when the local debug SMS provider is enabled.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokenPair:
      type: object
      required: [accessToken, refreshToken, expiresInSec, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSec:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        primaryFamilyId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'

    MeResponse:
      type: object
      required: [user, families]
      properties:
        user:
          $ref: '#/components/schemas/User'
        families:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMemberContext'

    User:
      type: object
      required: [id, status, displayName]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, suspended, deleted]
        displayName:
          type: string
        avatarUrl:
          anyOf:
            - type: string
            - type: 'null'

    DeviceRegistration:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [ios, android, ipad_os, web, admin_web]
        deviceName:
          type: string
        pushProvider:
          type: string
          enum: [apns, fcm, huawei, xiaomi, oppo, vivo]
        pushToken:
          type: string

    Family:
      type: object
      required: [id, name, timezone, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [active, locked, deleting, deleted]

    FamilyMember:
      type: object
      required: [id, familyId, userId, role, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MemberRole'
        childId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        displayName:
          type: string
        status:
          type: string
          enum: [active, invited, suspended, removed]

    FamilyMemberContext:
      type: object
      required: [family, member]
      properties:
        family:
          $ref: '#/components/schemas/Family'
        member:
          $ref: '#/components/schemas/FamilyMember'

    MemberRole:
      type: string
      enum: [parent_owner, parent, child_device]

    CreateFamilyRequest:
      type: object
      required: [name, timezone]
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          default: Asia/Shanghai
        firstChild:
          $ref: '#/components/schemas/CreateChildRequest'

    InviteParentRequest:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
          description: Phone number for the self-hosted version.

    FamilyInvite:
      type: object
      required: [id, familyId, status, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expiresAt:
          type: string
          format: date-time

    CreateChildRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
        birthYear:
          type: integer
          minimum: 2000
          maximum: 2100
        avatarAsset:
          type: string
        roomTheme:
          type: string
          default: star_cabin

    UpdateChildRequest:
      type: object
      properties:
        nickname:
          type: string
        birthYear:
          type: integer
        avatarAsset:
          type: string
        roomTheme:
          type: string

    ChildProfile:
      type: object
      required: [id, familyId, nickname, roomTheme, status]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        nickname:
          type: string
        birthYear:
          anyOf:
            - type: integer
            - type: 'null'
        avatarAsset:
          anyOf:
            - type: string
            - type: 'null'
        roomTheme:
          type: string
        status:
          type: string
          enum: [active, archived]

    CreatePairingSessionRequest:
      type: object
      required: [childId]
      properties:
        childId:
          type: string
          format: uuid

    PairingSessionCreated:
      type: object
      required: [sessionId, pairingCode, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        pairingCode:
          type: string
        expiresAt:
          type: string
          format: date-time

    ConsumePairingCodeRequest:
      type: object
      required: [pairingCode, device]
      properties:
        pairingCode:
          type: string
        device:
          $ref: '#/components/schemas/DeviceRegistration'

    TaskCategory:
      type: string
      enum: [study, reading, exercise, habit, custom]

    SubmissionType:
      type: string
      enum: [photo, audio, video, manual]

    TaskTemplate:
      type: object
      required: [id, familyId, title, category, submissionType]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/TaskCategory'
        submissionType:
          $ref: '#/components/schemas/SubmissionType'
        description:
          anyOf:
            - type: string
            - type: 'null'
        targetText:
          anyOf:
            - type: string
            - type: 'null'
        defaultDurationSec:
          anyOf:
            - type: integer
            - type: 'null'

    CreateTaskTemplateRequest:
      type: object
      required: [familyId, title, category, submissionType]
      properties:
        familyId:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/TaskCategory'
        submissionType:
          $ref: '#/components/schemas/SubmissionType'
        description:
          type: string
        targetText:
          type: string
        defaultDurationSec:
          type: integer

    SaveWeeklyPlanRequest:
      type: object
      required: [familyId, childId, weekId, startDate, endDate, rewardMode, rules]
      properties:
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        weekId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        rewardMode:
          type: string
          enum: [flexible, strict]
        wishId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanRuleInput'

    WeeklyPlanRuleInput:
      type: object
      required: [title, category, submissionType, weekdays, isCore, requireReview]
      properties:
        taskTemplateId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        title:
          type: string
        category:
          $ref: '#/components/schemas/TaskCategory'
        submissionType:
          $ref: '#/components/schemas/SubmissionType'
        description:
          type: string
        targetText:
          type: string
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        isCore:
          type: boolean
        requireReview:
          type: boolean
        sortOrder:
          type: integer

    WeeklyPlan:
      type: object
      required: [id, familyId, childId, weekId, startDate, endDate, rewardMode, status, rules]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        weekId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        rewardMode:
          type: string
          enum: [flexible, strict]
        status:
          type: string
          enum: [draft, active, archived]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPlanRule'

    WeeklyPlanRule:
      allOf:
        - $ref: '#/components/schemas/WeeklyPlanRuleInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    TaskInstance:
      type: object
      required: [id, familyId, childId, scheduledDate, title, category, submissionType, status, isCore, requireReview]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        scheduledDate:
          type: string
          format: date
        title:
          type: string
        category:
          $ref: '#/components/schemas/TaskCategory'
        submissionType:
          $ref: '#/components/schemas/SubmissionType'
        description:
          anyOf:
            - type: string
            - type: 'null'
        targetText:
          anyOf:
            - type: string
            - type: 'null'
        isCore:
          type: boolean
        requireReview:
          type: boolean
        status:
          type: string
          enum: [todo, submitted, ai_processing, pending_review, approved, needs_revision, skipped, expired, adjusted_by_parent]
        latestSubmissionId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'

    TodaySnapshot:
      type: object
      required: [child, date, tasks]
      properties:
        child:
          $ref: '#/components/schemas/ChildProfile'
        date:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskInstance'
        dailySummary:
          $ref: '#/components/schemas/DailySummary'
        currentWish:
          $ref: '#/components/schemas/Wish'

    SkipTaskRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    PostponeTaskRequest:
      type: object
